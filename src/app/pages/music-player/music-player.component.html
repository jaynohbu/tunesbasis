<!-- ================= JAM SESSION ================= -->
<app-jam-session
  *ngIf="groupId && scene?.sceneId && playerEngine"
  [groupId]="groupId"
  [sceneId]="scene.sceneId!"
  [playerEngine]="playerEngine"
  (playbackStateChanged)="onJamPlaybackStateChanged($event)"
  (recordedStemsReady)="onRecordedStemsReady($event)"
  (clearRecordedStems)="onClearRecordedStems()">
</app-jam-session>

<!-- ================= GLOBAL CONTROLS ================= -->

<div *ngIf="stems.length" class="controls-container">
  <!-- Scene Playback Info -->
  <div *ngIf="playingScene" class="scene-playback-info">
    <div class="song-flow">
      <span class="current-song">{{ getCurrentSongName() }}</span>
      <i class="pi pi-arrow-right"></i>
      <span class="next-song">{{ getNextSongName() }}</span>
    </div>
  </div>

  <!-- Control Buttons -->
  <div class="controls">
  <!-- Hide Play/Play Scene buttons when in jam session -->
  <p-button
    *ngIf="!isInJamSession()"
    [label]="playing ? 'Pause' : 'Play'"
    [icon]="playing ? 'pi pi-pause' : 'pi pi-play'"
    [disabled]="!waveformsReady"
    (onClick)="togglePlay()">
  </p-button>

  <p-button
    *ngIf="!isInJamSession()"
    [label]="playingScene ? 'Stop Scene' : 'Play Scene'"
    [icon]="playingScene ? 'pi pi-stop' : 'pi pi-play-circle'"
    [disabled]="!waveformsReady"
    styleClass="p-button-success"
    (onClick)="togglePlayScene()">
  </p-button>

  <p-button
    *ngIf="groupId && !isInJamSession()"
    label="Start Jamming"
    icon="pi pi-users"
    styleClass="p-button-info p-button-sm"
    [loading]="isConnectingToJam()"
    (onClick)="onStartJamming()">
  </p-button>

  <label>
    Master Volume
    <input type="range" min="0" max="1" step="0.01" [value]="globalVolume"
      (input)="setGlobalVolume($any($event.target).value)" />
  </label>

  <p-button
    label="Reset All Effects"
    icon="pi pi-replay"
    severity="warning"
    size="small"
    (onClick)="resetAllStemsAllKnobs()">
  </p-button>
  </div>
</div>

<!-- ================= LIVE PARTICIPANT WAVEFORMS ================= -->
<div *ngIf="groupId && scene?.sceneId" class="live-waveforms-container">
  <app-participant-waveforms
    [mode]="showingLiveMics ? 'live' : 'recorded'"
    [localEnabled]="isMicrophoneEnabled()"
    [localStream]="getLocalMicStream()"
    [remoteStreams]="getRemoteStreams()"
    [recordedStems]="recordedMicStems">
  </app-participant-waveforms>
</div>

<!-- ================= STEM TRACKS ================= -->

<div *ngFor="let stem of stems" class="track">

  <div class="label">{{ stem.name }}</div>

  <!-- WAVEFORM -->
  <div class="wave-wrapper" (click)="seekFromWave($event)">
    <canvas [attr.data-stem]="stem.name"></canvas>
    <div class="cursor" [style.left.%]="cursorPercent"></div>
  </div>

  <!-- BASIC CONTROLS -->
  <div class="controls">
    <label>
      Volume
      <input type="range" min="0" max="1" step="0.01" [value]="stemVolumes[stem.name]"
        (input)="setStemVolume(stem.name, $any($event.target).value)" />
    </label>

    <p-button [label]="stemMuted[stem.name] ? 'Unmute' : 'Mute'"
      [icon]="stemMuted[stem.name] ? 'pi pi-volume-up' : 'pi pi-volume-off'" [styleClass]="stemMuted[stem.name]
    ? 'p-button-secondary'
    : 'p-button-danger'" size="small" (onClick)="toggleMute(stem.name)">
    </p-button>


  </div>

  <!-- ================= FADERS ================= -->

  <div class="fader-panel" *ngIf="stemKnobs[stem.name]">

    <!-- PREGAIN -->
    <div class="fader-group">
      <span class="fader-label">Pre</span>
      <input
        type="range"
        class="fader"
        orient="vertical"
        min="0"
        max="1"
        step="0.01"
        [value]="stemKnobs[stem.name].pregain"
        (input)="setKnob(stem.name, 'pregain', $any($event.target).value)"
        (dblclick)="resetKnob(stem.name, 'pregain')" />
      <p-button label="Reset" icon="pi pi-refresh" size="small" text (onClick)="resetKnob(stem.name, 'pregain')">
      </p-button>
    </div>

    <!-- COMPRESSION -->
    <div class="fader-group">
      <span class="fader-label">Comp</span>
      <input
        type="range"
        class="fader"
        orient="vertical"
        min="0"
        max="1"
        step="0.01"
        [value]="stemKnobs[stem.name].compression"
        (input)="setKnob(stem.name, 'compression', $any($event.target).value)"
        (dblclick)="resetKnob(stem.name, 'compression')" />
      <p-button label="Reset" icon="pi pi-refresh" size="small" text (onClick)="resetKnob(stem.name, 'compression')">
      </p-button>
    </div>

    <!-- TONE -->
    <div class="fader-group">
      <span class="fader-label">Tone</span>
      <input
        type="range"
        class="fader"
        orient="vertical"
        min="0"
        max="1"
        step="0.01"
        [value]="stemKnobs[stem.name].tone"
        (input)="setKnob(stem.name, 'tone', $any($event.target).value)"
        (dblclick)="resetKnob(stem.name, 'tone')" />
      <p-button label="Reset" icon="pi pi-refresh" size="small" text (onClick)="resetKnob(stem.name, 'tone')">
      </p-button>
    </div>

    <!-- DISTORTION (ONLY GUITAR / PIANO) -->
    <ng-container *ngIf="isDistortable(stem.name)">
      <div class="fader-group">
        <span class="fader-label">Drive</span>
        <input
          type="range"
          class="fader"
          orient="vertical"
          min="0"
          max="1"
          step="0.01"
          [value]="stemKnobs[stem.name].distortion"
          (input)="setKnob(stem.name, 'distortion', $any($event.target).value)"
          (dblclick)="resetKnob(stem.name, 'distortion')" />
        <p-button label="Reset" icon="pi pi-refresh" size="small" text (onClick)="resetKnob(stem.name, 'distortion')">
        </p-button>
      </div>

      <!-- BYPASS -->
      <div class="led-group">
        <div class="led" [class.on]="!stemBypassLED[stem.name]" (click)="toggleBypassLED(stem.name)"></div>
        <span>Bypass</span>
      </div>
    </ng-container>

    <!-- 3-BAND EQ -->
    <div class="fader-group">
      <span class="fader-label">Low</span>
      <input
        type="range"
        class="fader eq-fader"
        orient="vertical"
        min="0"
        max="1"
        step="0.01"
        [value]="stemKnobs[stem.name].eqLow"
        (input)="setKnob(stem.name, 'eqLow', $any($event.target).value)"
        (dblclick)="resetKnob(stem.name, 'eqLow')" />
      <p-button label="Reset" icon="pi pi-refresh" size="small" text (onClick)="resetKnob(stem.name, 'eqLow')">
      </p-button>
    </div>

    <div class="fader-group">
      <span class="fader-label">Mid</span>
      <input
        type="range"
        class="fader eq-fader"
        orient="vertical"
        min="0"
        max="1"
        step="0.01"
        [value]="stemKnobs[stem.name].eqMid"
        (input)="setKnob(stem.name, 'eqMid', $any($event.target).value)"
        (dblclick)="resetKnob(stem.name, 'eqMid')" />
      <p-button label="Reset" icon="pi pi-refresh" size="small" text (onClick)="resetKnob(stem.name, 'eqMid')">
      </p-button>
    </div>

    <div class="fader-group">
      <span class="fader-label">High</span>
      <input
        type="range"
        class="fader eq-fader"
        orient="vertical"
        min="0"
        max="1"
        step="0.01"
        [value]="stemKnobs[stem.name].eqHigh"
        (input)="setKnob(stem.name, 'eqHigh', $any($event.target).value)"
        (dblclick)="resetKnob(stem.name, 'eqHigh')" />
      <p-button label="Reset" icon="pi pi-refresh" size="small" text (onClick)="resetKnob(stem.name, 'eqHigh')">
      </p-button>
    </div>

    <!-- REVERB (ONLY FOR VOCALS) -->
    <ng-container *ngIf="stem.name === 'vocals'">
      <div class="fader-group">
        <span class="fader-label">Reverb</span>
        <input
          type="range"
          class="fader reverb-fader"
          orient="vertical"
          min="0"
          max="1"
          step="0.01"
          [value]="stemKnobs[stem.name].reverb"
          (input)="setKnob(stem.name, 'reverb', $any($event.target).value)"
          (dblclick)="resetKnob(stem.name, 'reverb')" />
        <p-button label="Reset" icon="pi pi-refresh" size="small" text (onClick)="resetKnob(stem.name, 'reverb')">
        </p-button>
      </div>
    </ng-container>

    <!-- RESET ALL FADERS -->
    <div class="reset-all-group">
      <p-button
        label="Reset All"
        icon="pi pi-replay"
        severity="secondary"
        size="small"
        (onClick)="resetAllKnobs(stem.name)">
      </p-button>
    </div>

  </div>
</div>
