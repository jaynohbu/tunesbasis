<!-- ================= UPLOAD ================= -->
<music-upload
  (uploadFinished)="onProcessCompleted()"
  (uploadFailed)="onUploadFailed($event)">
</music-upload>


<p-tabView
  *ngIf="scenes?.length"
  [(activeIndex)]="activeSceneIndex">

  <p-tabPanel
    *ngFor="let scene of scenes; let i = index"
    [header]="scene.name">

    <scene-player-tab   (sceneUpdated)="onSceneUpdated($event)" [scene]="scene"></scene-player-tab>

  </p-tabPanel>

</p-tabView>
