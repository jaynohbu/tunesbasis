<div class="scene-container">

  <!-- ================= Scene Actions ================= -->
  <div class="scene-actions" *ngIf="!overlayOpen">
    <p-button
      icon="pi pi-save"
      label="Save Song Settings"
      styleClass="p-button-sm p-button-success"
      (onClick)="onUpdateScene()">
    </p-button>

    <p-button
      icon="pi pi-copy"
      label="Copy Scene"
      styleClass="p-button-sm p-button-info"
      (onClick)="onCopyScene()">
    </p-button>

    <p-button
      icon="pi pi-trash"
      label="Delete Scene"
      styleClass="p-button-sm p-button-danger"
      (onClick)="onDeleteScene()">
    </p-button>

    <p-button
      icon="pi pi-list"
      label="Songs"
      styleClass="p-button-sm p-button-outlined"
      (onClick)="toggleOverlay()">
    </p-button>
  </div>

  <!-- ================= Player ================= -->
  <music-player [scene]="scene" [isTabActive]="isActive"></music-player>

  <!-- ================= Overlay ================= -->
  <div class="overlay" *ngIf="overlayOpen">

    <!-- Close button -->
    <p-button
      icon="pi pi-times"
      class="overlay-close"
      styleClass="p-button-sm p-button-text"
      (onClick)="toggleOverlay()">
    </p-button>

    <scene-editor
      [scene]="scene"
      [selectedIndex]="selectedIndex"
      (selectSong)="selectedIndex = $event"
      (loadSong)="onLoadSong($event)"
      (sceneChange)="onSceneChange($event)"
      (copyAsNewScene)="onCopyScene()"
      (deleteSong)="onDeleteSong($event)"
      (songRenamed)="onSongRenamed()">
    </scene-editor>

  </div>

</div>
