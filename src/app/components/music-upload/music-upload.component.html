<!-- ================= FILE SELECT ================= -->

<input
  type="file"
  accept="audio/*"
  hidden
  #fileInput
  (change)="onFileSelected($event)"
/>

<p-button
  label="Choose Audio"
  icon="pi pi-folder-open"
  styleClass="p-button-outlined"
  [disabled]="loading"
  (onClick)="fileInput.click()">
</p-button>

<span class="file-name p-ml-2" *ngIf="file">
  {{ file.name }}
</span>

<!-- ================= UPLOAD BUTTON ================= -->

<p-button
  label="Upload & Analyze"
  icon="pi pi-upload"
  class="p-ml-2"
  [loading]="loading"
  [disabled]="!file || loading"
  (onClick)="showSongNameDialog()">
</p-button>

<!-- ================= SONG NAME DIALOG ================= -->

<p-dialog
  header="Enter Song Name"
  [(visible)]="displayDialog"
  [modal]="true"
  [style]="{width: '400px'}"
  [closable]="true">

  <div class="p-fluid">
    <label for="songName">Song Name</label>
    <input
      id="songName"
      type="text"
      pInputText
      [(ngModel)]="songName"
      maxlength="40"
      placeholder="Enter song name (max 40 characters)"
      (keyup.enter)="confirmUpload()"
    />
    <small class="p-text-secondary">{{ songName.length }}/40 characters</small>
  </div>

  <ng-template pTemplate="footer">
    <p-button
      label="Cancel"
      icon="pi pi-times"
      styleClass="p-button-text"
      (onClick)="displayDialog = false">
    </p-button>
    <p-button
      label="Upload"
      icon="pi pi-check"
      [disabled]="!songName.trim()"
      (onClick)="confirmUpload()">
    </p-button>
  </ng-template>
</p-dialog>

<!-- ================= PROGRESS ================= -->

<div *ngIf="loading" class="p-mt-3">

  <!-- Uploading (determinate) -->
  <p-progressBar
    *ngIf="progressMode === 'upload'"
    [value]="progress">
  </p-progressBar>

  <!-- Processing (indeterminate) -->
  <p-progressBar
    *ngIf="progressMode === 'processing'"
    mode="indeterminate">
  </p-progressBar>

  <div class="p-text-secondary p-mt-2">
    {{ progressMode === 'upload'
      ? 'Uploading…'
      : 'Processing audio… (this may take a few minutes)' }}
  </div>

</div>
